<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Edit your website · Amuwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F4B;--navy-2:#13306f;--red:#E31E24;--red-ink:#b5161b;
  --ink:#15171C;--ink-2:#5E636E;--line:#E3E6EB;--paper:#fff;--paper-2:#F5F7FA;
  --ok:#12A150;--warn:#8A5A00;
  --r:12px;--top:56px;--nav:62px;
  font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper-2);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:fixed;inset:0 0 auto 0;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;
  display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;z-index:30}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.brand b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{height:38px;min-width:38px;padding:0 10px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600}
.tb:disabled{opacity:.35}
.tb svg{width:18px;height:18px}
.tb.pub{background:var(--red);padding:0 14px}
.tb.pub[data-dirty="1"]::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff;margin-left:2px}
.tb .lbl{display:none}
@media (min-width:640px){.tb .lbl{display:inline}}

/* ---------- layout ---------- */
.stage{position:fixed;left:0;right:0;top:calc(var(--top) + env(safe-area-inset-top));bottom:calc(var(--nav) + env(safe-area-inset-bottom));
  display:flex;justify-content:center;background:#e9ecf1}
.stage iframe{border:0;width:100%;height:100%;background:#fff;transition:width .25s}
.stage.phone iframe{width:390px;max-width:100%;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.12)}
.panel{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));max-height:58vh;overflow:auto;
  background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(10,20,40,.18);z-index:20;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}
.panel.open{transform:none}
.panel-h{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line);z-index:2}
.panel-h h2{margin:0;font-size:16px;font-weight:700;flex:1}
.x{border:0;background:var(--paper-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.panel-b{padding:12px 14px 18px}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:25}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--red)}
.nav .ai-tab svg{color:#fff;background:var(--red);border-radius:10px;padding:4px;width:30px;height:30px}

@media (min-width:900px){
  :root{--nav:0px}
  .stage{right:380px}
  .panel{left:auto;right:0;top:calc(var(--top) + env(safe-area-inset-top));bottom:0;width:380px;max-height:none;border-radius:0;
    transform:none;box-shadow:-1px 0 0 var(--line);padding-top:56px}
  .panel-h{position:fixed;top:calc(var(--top) + env(safe-area-inset-top));right:0;width:380px;height:56px;border-bottom:1px solid var(--line)}
  .nav{top:calc(var(--top) + env(safe-area-inset-top));bottom:auto;left:auto;right:0;width:380px;height:56px;padding:0;grid-template-columns:repeat(6,1fr);z-index:26;border-top:0;border-bottom:1px solid var(--line)}
  .nav button{flex-direction:row;gap:5px}
  .nav button span{display:none}
  .panel{padding-top:112px}
  .panel-h{top:calc(var(--top) + 56px + env(safe-area-inset-top))}
  .x.close-sheet{display:none}
}

/* ---------- controls ---------- */
.hint{color:var(--ink-2);font-size:14px;line-height:1.5;margin:4px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.btn{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger{color:var(--red-ink);border-color:#f3c9ca}
.btn.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn.full{width:100%}
.btn svg{width:17px;height:17px}
.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 6px}
.fld{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea.fld{min-height:96px;resize:vertical;line-height:1.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;min-width:42px;height:40px;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:600}
.sw input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;border-radius:8px}
.chip{border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:8px 12px;font-size:13px;text-align:left}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff}
.item .nm{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:none;text-align:left;padding:6px 4px}
.item.off .nm{opacity:.45;text-decoration:line-through}
.ib{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:16px;height:16px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.th{position:relative;border-radius:10px;overflow:hidden;background:var(--paper-2);aspect-ratio:1;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .acts{position:absolute;inset:auto 4px 4px 4px;display:flex;gap:4px}
.th .acts button{flex:1;height:28px;border:0;border-radius:7px;background:rgba(0,0,0,.66);color:#fff;font-size:12px;font-weight:600}
.th.add{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink-2);font-size:13px;border-style:dashed}
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl button{min-height:64px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:10px;font-size:13px;font-weight:600;line-height:1.3}
.tpl button small{display:block;font-weight:400;color:var(--ink-2);margin-top:2px}
.selname{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.selname b{font-size:15px}
.selname .tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--red);padding:3px 8px;border-radius:999px}
.ver{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px}
.ver div{flex:1;min-width:0}
.ver b{display:block;font-size:14px}
.ver small{display:block;color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-msg{padding:12px;border-radius:12px;background:var(--paper-2);font-size:14px;line-height:1.45;margin-top:10px}
.ai-msg.ok{background:#e3f5ea;color:#0f5a32}
.ai-msg.err{background:#fde7e7;color:#8c1217}

/* ---------- overlays ---------- */
.cover{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:60;text-align:center;padding:24px}
.cover h1{margin:0;font-size:22px}
.cover p{margin:0;opacity:.8;max-width:420px;line-height:1.5}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 0.9s linear infinite}
.spin.dark{border-color:rgba(11,31,75,.15);border-top-color:var(--navy);width:22px;height:22px;border-width:2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:calc(var(--top) + env(safe-area-inset-top) + 10px);transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:70;transition:.25s;max-width:calc(100% - 24px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{color:#9ff0c2}
.banner{position:fixed;left:12px;right:12px;top:calc(var(--top) + env(safe-area-inset-top) + 10px);z-index:40;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:14px}
@media (min-width:900px){.banner{right:392px}}
.busy{position:fixed;inset:0;background:rgba(11,31,75,.55);display:flex;align-items:center;justify-content:center;z-index:65}
.busy .card{background:#fff;border-radius:16px;padding:20px;display:flex;align-items:center;gap:12px;font-weight:600;max-width:320px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="cover" id="cover"><div class="spin"></div><h1>Opening your website…</h1><p>Please wait a few seconds.</p></div>

<header class="top">
  <div class="brand"><small>Edit your website</small><b id="bizName">…</b></div>
  <button class="tb" id="undoBtn" title="Undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="tb" id="redoBtn" title="Redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <button class="tb" id="viewBtn" title="Preview" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">Preview</span></button>
  <button class="tb hidden" id="deviceBtn" title="Phone / computer view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></button>
  <button class="tb pub" id="pubBtn" data-dirty="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg><span>Publish</span></button>
</header>

<main class="stage" id="stage"><iframe id="frame" title="Your website"></iframe></main>

<aside class="panel" id="panel" aria-live="polite">
  <div class="panel-h"><h2 id="panelTitle">Edit</h2><button class="x close-sheet" id="closePanel" aria-label="Close">×</button></div>
  <div class="panel-b" id="panelBody"></div>
</aside>

<nav class="nav" id="nav">
  <button data-tab="edit" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Edit</span></button>
  <button data-tab="sections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="6" rx="1.5"/><rect x="3" y="12" width="18" height="9" rx="1.5"/></svg><span>Sections</span></button>
  <button data-tab="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/></svg><span>Colours</span></button>
  <button data-tab="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><span>Photos</span></button>
  <button data-tab="ai" class="ai-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span>Ask AI</span></button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
</nav>

<input type="file" id="fileIn" accept="image/*" class="hidden">
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const API = 'https://koku.app.n8n.cloud/webhook/site-editor';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = s => document.querySelector(s);
const frame = $('#frame'), panel = $('#panel'), pBody = $('#panelBody'), pTitle = $('#panelTitle');
const isDesk = () => matchMedia('(min-width:900px)').matches;

let BASE = '', LIVE = '', BUSINESS = '';
let current = '';            // last committed clean HTML
let published = '';          // HTML that is live now
const undoS = [], redoS = [];
let sel = null, tab = 'edit', previewMode = false, editingEl = null, editStart = '';

/* ---------------- helpers ---------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg, ms = 2600) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
function busy(msg) { const d = document.createElement('div'); d.className = 'busy'; d.innerHTML = '<div class="card"><div class="spin dark"></div><span>' + esc(msg) + '</span></div>'; document.body.appendChild(d); return () => d.remove(); }
async function api(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token: TOKEN, action }, data || {})) });
  let j = null; try { j = await r.json(); } catch (e) { throw new Error('The server did not answer. Please try again.'); }
  if (!r.ok) throw new Error((j && j.error) || 'Something went wrong. Please try again.');
  return j;
}
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const DRAFT = 'amuwa-draft-' + TOKEN;

/* ---------------- canvas in / out ---------------- */
const CANVAS_CSS = `
[data-amuwa-sel]{outline:3px solid #E31E24!important;outline-offset:2px!important;cursor:text}
[data-amuwa-hover]:not([data-amuwa-sel]){outline:2px dashed rgba(227,30,36,.55)!important;outline-offset:2px!important;cursor:pointer}
[contenteditable="true"]{cursor:text;caret-color:#E31E24}
.rv,.rv-img,.rv-scale,.load,[class*="reveal"]{opacity:1!important;transform:none!important;clip-path:none!important;animation:none!important}
html.amuwa-preview [data-amuwa-sel],html.amuwa-preview [data-amuwa-hover]{outline:none!important}
#amuwa-preview-bar{display:none!important}`;

function toCanvas(clean) {
  const doc = new DOMParser().parseFromString(clean, 'text/html');
  doc.querySelectorAll('#amuwa-preview-bar').forEach(e => e.remove());
  doc.querySelectorAll('script').forEach(s => { s.setAttribute('data-amuwa-type', s.hasAttribute('type') ? s.getAttribute('type') : '__none__'); s.setAttribute('type', 'text/x-amuwa-off'); });
  doc.querySelectorAll('*').forEach(el => { for (const a of [...el.attributes]) if (/^on[a-z]+$/i.test(a.name)) { el.setAttribute('data-amuwa-' + a.name.toLowerCase(), a.value); el.removeAttribute(a.name); } });
  const base = doc.createElement('base'); base.id = 'amuwa-base'; base.href = BASE; doc.head.prepend(base);
  const st = doc.createElement('style'); st.id = 'amuwa-editor-css'; st.textContent = CANVAS_CSS; doc.head.appendChild(st);
  return '<!doctype html>\n' + doc.documentElement.outerHTML;
}
function fromCanvas() {
  const d = frame.contentDocument; if (!d || !d.documentElement) return current;
  const root = d.documentElement.cloneNode(true);
  root.classList.remove('amuwa-preview'); if (!root.getAttribute('class')) root.removeAttribute('class');
  root.querySelectorAll('#amuwa-base,#amuwa-editor-css,[data-amuwa-ui]').forEach(e => e.remove());
  root.querySelectorAll('[data-amuwa-unhide]').forEach(e => { e.setAttribute('hidden', ''); e.removeAttribute('data-amuwa-unhide'); });
  root.querySelectorAll('[data-amuwa-sel],[data-amuwa-hover]').forEach(e => { e.removeAttribute('data-amuwa-sel'); e.removeAttribute('data-amuwa-hover'); });
  root.querySelectorAll('[data-amuwa-ce]').forEach(e => { e.removeAttribute('contenteditable'); e.removeAttribute('data-amuwa-ce'); e.removeAttribute('spellcheck'); });
  root.querySelectorAll('script[data-amuwa-type]').forEach(s => { const t = s.getAttribute('data-amuwa-type'); if (t === '__none__') s.removeAttribute('type'); else s.setAttribute('type', t); s.removeAttribute('data-amuwa-type'); });
  root.querySelectorAll('*').forEach(el => { for (const a of [...el.attributes]) if (/^data-amuwa-on[a-z]+$/.test(a.name)) { el.setAttribute(a.name.slice(11), a.value); el.removeAttribute(a.name); } });
  root.querySelectorAll('[style=""]').forEach(e => e.removeAttribute('style'));
  return '<!doctype html>\n' + root.outerHTML;
}
function render(clean, keepScroll) {
  return new Promise(res => {
    let y = 0; try { y = keepScroll ? frame.contentWindow.scrollY : 0; } catch (e) {}
    frame.onload = () => { wire(); showPhotoPreviews(); if (keepScroll) try { frame.contentWindow.scrollTo(0, y); } catch (e) {} res(); };
    sel = null; editingEl = null;
    frame.srcdoc = toCanvas(clean);
  });
}

/* ---------------- history ---------------- */
function commit(silent) {
  const now = fromCanvas();
  if (now === current) return false;
  undoS.push(current); if (undoS.length > 60) undoS.shift();
  redoS.length = 0; current = now; afterChange(); return true;
}
function afterChange() {
  $('#undoBtn').disabled = !undoS.length; $('#redoBtn').disabled = !redoS.length;
  const dirty = current !== published; $('#pubBtn').dataset.dirty = dirty ? '1' : '0';
  if (dirty) store.set(DRAFT, { html: current, at: Date.now() }); else store.del(DRAFT);
}
async function undo() { stopEditing(); commit(); if (!undoS.length) return; redoS.push(current); current = undoS.pop(); await render(current, true); afterChange(); refreshTab(); }
async function redo() { stopEditing(); if (!redoS.length) return; undoS.push(current); current = redoS.pop(); await render(current, true); afterChange(); refreshTab(); }

/* ---------------- canvas wiring ---------------- */
function D() { return frame.contentDocument; }
function wire() {
  const d = D(); if (!d) return;
  if (previewMode) d.documentElement.classList.add('amuwa-preview');
  d.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a,button,label,summary');
    if (previewMode) { if (a && a.tagName === 'A') e.preventDefault(); return; }
    e.preventDefault(); e.stopPropagation();
    pick(e.target);
  }, true);
  d.addEventListener('submit', e => e.preventDefault(), true);

function addSection(t) {

/* ---------------- THEME tab ---------------- */
const FONTS = ['Inter', 'Poppins', 'Montserrat', 'DM Sans', 'Manrope', 'Archivo', 'Rubik', 'Nunito', 'Mukta', 'Hind', 'Baloo 2', 'Playfair Display', 'Fraunces', 'Lora', 'Merriweather', 'Cormorant Garamond', 'Instrument Serif', 'Oswald', 'Bebas Neue', 'Big Shoulders Display', 'Space Grotesk', 'IBM Plex Sans', 'Open Sans', 'Roboto'];
function rootVars() {
  const d = D(), out = [];
  const txt = [...d.querySelectorAll('style')].filter(s => s.id !== 'amuwa-editor-css').map(s => s.textContent).join('\n');
  const m = txt.match(/:root\s*\{([^}]*)\}/); if (!m) return out;
  const seen = new Set();
  for (const mm of m[1].matchAll(/(--[\w-]+)\s*:\s*([^;]+)/g)) { if (seen.has(mm[1])) continue; seen.add(mm[1]); out.push({ name: mm[1], raw: mm[2].trim() }); }
  return out;
}
function niceName(v) {
  const map = { 'f-display': 'Headings font', 'f-body': 'Text font', 'f-serif': 'Quote font', 'f-mono': 'Label font', ink: 'Main text', paper: 'Page background', bg: 'Page background', accent: 'Accent', primary: 'Main colour' };
  const k = v.replace(/^--/, ''); return map[k] || k.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function tabTheme() {
  const d = D(), root = d.documentElement, vars = rootVars();
  const colours = [], fonts = [];
  for (const v of vars) {
    if (/^--f-|font/i.test(v.name) && /["',]/.test(v.raw)) { fonts.push(v); continue; }
    if (/var\(/.test(v.raw)) continue;
    const probe = d.createElement('i'); probe.style.color = v.raw; if (!probe.style.color) continue;
    probe.style.display = 'none'; d.body.appendChild(probe); const hx = rgb2hex(frame.contentWindow.getComputedStyle(probe).color); probe.remove();
    if (!hx) continue;
    const curr = root.style.getPropertyValue(v.name).trim();
    colours.push({ name: v.name, hex: curr && /^#/.test(curr) ? curr : hx });
  }
  pBody.innerHTML = `<p class="hint" style="margin-top:0">These colours and fonts are used across your whole website.</p>
    ${colours.length ? `<label class="lab">Colours</label><div class="row">${colours.map(c => `<label class="sw"><input type="color" data-var="${c.name}" value="${c.hex}">${esc(niceName(c.name))}</label>`).join('')}</div>` : '<p class="hint">This website has no theme colours to change. Tap any part to change its colour.</p>'}
    ${fonts.map(f => { const cur = (root.style.getPropertyValue(f.name) || f.raw).split(',')[0].replace(/["']/g, '').trim(); return `<label class="lab">${esc(niceName(f.name))}</label><select class="fld" data-font="${f.name}">${[cur, ...FONTS.filter(x => x !== cur)].map(n => `<option ${n === cur ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`; }).join('')}
    <div class="row" style="margin-top:16px"><button class="btn" id="resetTheme">Reset to original colours & fonts</button></div>`;
  pBody.querySelectorAll('[data-var]').forEach(i => { i.addEventListener('input', () => root.style.setProperty(i.dataset.var, i.value)); i.addEventListener('change', () => commit()); });
  pBody.querySelectorAll('[data-font]').forEach(s => s.addEventListener('change', () => {
    const name = s.value, v = vars.find(x => x.name === s.dataset.font), fallback = v.raw.split(',').slice(1).join(',') || 'sans-serif';
    root.style.setProperty(s.dataset.font, `"${name}",${fallback}`);
    let lk = d.getElementById('amuwa-fonts');
    const fams = new Set((lk ? new URL(lk.href).searchParams.get('family') || '' : '').split('|').filter(Boolean)); fams.add(name.replace(/ /g, '+') + ':400,500,600,700,800');
    if (!lk) { lk = d.createElement('link'); lk.id = 'amuwa-fonts'; lk.rel = 'stylesheet'; d.head.appendChild(lk); }
    lk.href = 'https://fonts.googleapis.com/css?family=' + [...fams].join('|') + '&display=swap';
    commit(); toast('Font changed');
  }));
  $('#resetTheme').addEventListener('click', () => { root.removeAttribute('style'); const lk = d.getElementById('amuwa-fonts'); if (lk) lk.remove(); commit(); tabTheme(); toast('Back to the original look'); });
}

/* ---------------- PHOTOS tab ---------------- */
function photosScript() { const d = D(); return [...d.querySelectorAll('script')].find(s => /window\.SITE_PHOTOS\s*=/.test(s.textContent)); }
function readPhotos() {
  const s = photosScript(); if (!s) return null;
  const t = s.textContent, at = t.search(/window\.SITE_PHOTOS\s*=\s*\{/); if (at < 0) return null;
  const start = t.indexOf('{', at); let depth = 0, inStr = false, q = '', end = -1;
  for (let i = start; i < t.length; i++) {
    const c = t[i];
    if (inStr) { if (c === '\\') i++; else if (c === q) inStr = false; continue; }
    if (c === '"' || c === "'") { inStr = true; q = c; } else if (c === '{') depth++; else if (c === '}') { if (--depth === 0) { end = i + 1; break; } }
  }
  if (end < 0) return null;
  try { return { s, data: JSON.parse(t.slice(start, end)), raw: t.slice(at, end) }; } catch (e) { return null; }
}
// The site fills its photo slideshows and gallery with its own code, which is switched off while editing.
// Show the same photos in the editor only (marked data-amuwa-ui, so they are never saved).
function showPhotoPreviews() {
  const d = D(), p = readPhotos(); if (!d || !p || !p.data.plan) return;
  const plan = p.data.plan;
  d.querySelectorAll('[data-slot]').forEach(el => {
    const list = plan[el.getAttribute('data-slot')] || []; const first = srcOf(list[0]);
    if (!first || el.querySelector('img')) return;
    const im = d.createElement('img'); im.setAttribute('data-amuwa-ui', ''); im.className = 'on'; im.alt = ''; im.src = first;
    if (!/ph-bg/.test(el.className)) im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1';
    el.appendChild(im);
  });
  const gal = plan.gallery || []; if (!gal.length) return;
  const track = d.querySelector('#galTrack,.gal-track,[id*="gallery"] ul,[class*="gallery"] ul');
  if (!track || track.querySelector('img')) return;
  gal.forEach(x => {
    const li = d.createElement('li'); li.className = 'gal-item'; li.setAttribute('data-amuwa-ui', '');
    li.innerHTML = '<figure><div class="gal-frame"><img alt="" src="' + esc(srcOf(x)) + '"></div></figure>';
    track.appendChild(li);
  });
  const sec = track.closest('[hidden]'); if (sec) { sec.removeAttribute('hidden'); sec.setAttribute('data-amuwa-unhide', ''); }
}
async function photosChanged() { commit(); await render(current, true); tabPhotos(); }
function writePhotos(p) { p.s.textContent = p.s.textContent.replace(p.raw, () => 'window.SITE_PHOTOS=' + JSON.stringify(p.data)); }
const srcOf = x => typeof x === 'string' ? x : (x && x.src) || '';
const GROUPS = { hero: 'Top slideshow', offer: 'Services background', events: 'Packages background', gallery: 'Photo gallery' };
function tabPhotos() {
  const d = D(), p = readPhotos();
  const imgs = [...d.querySelectorAll('img')].filter(i => !i.closest('[data-amuwa-ui]'));
  let h = '';
  if (p && p.data.plan) {
    for (const g of Object.keys(GROUPS)) {
      const list = p.data.plan[g]; if (!Array.isArray(list)) continue;
      h += `<label class="lab">${GROUPS[g]}</label><div class="thumbs">${list.map((x, i) => `<div class="th"><img src="${esc(BASE + srcOf(x))}" alt="" loading="lazy"><div class="acts"><button data-g="${g}" data-rep="${i}">Change</button><button data-g="${g}" data-rm="${i}">Remove</button></div></div>`).join('')}<button class="th add" data-g="${g}" data-add="1">+ Add photo</button></div>`;
    }
    h += `<p class="hint" style="margin-top:10px">These photos appear when your website is open (the editor shows them here).</p>`;
  }
  h += `<label class="lab">Photos on the page</label>${imgs.length ? `<div class="thumbs">${imgs.map((im, i) => `<div class="th"><img src="${esc(im.src)}" alt="" loading="lazy"><div class="acts"><button data-pi="${i}">Change</button><button data-go="${i}">Find</button></div></div>`).join('')}</div>` : '<p class="hint">No photos on the page yet. Add a "Photo + text" or "Photo gallery" section from Sections.</p>'}`;
  pBody.innerHTML = h;
  pBody.querySelectorAll('[data-rep]').forEach(b => b.addEventListener('click', () => choosePhoto(async path => { const q = readPhotos(); q.data.plan[b.dataset.g][+b.dataset.rep] = path; swapAlt(q, path); writePhotos(q); photosChanged(); })));
  pBody.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { const q = readPhotos(); q.data.plan[b.dataset.g].splice(+b.dataset.rm, 1); writePhotos(q); photosChanged(); toast('Photo removed'); }));
  pBody.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => choosePhoto(async path => { const q = readPhotos(); q.data.plan[b.dataset.g].push(path); swapAlt(q, path); writePhotos(q); photosChanged(); })));
  pBody.querySelectorAll('[data-pi]').forEach(b => b.addEventListener('click', () => { const im = imgs[+b.dataset.pi]; choosePhoto(async path => { im.setAttribute('src', path); im.removeAttribute('srcset'); commit(); tabPhotos(); }); }));
  pBody.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { const im = imgs[+b.dataset.go]; im.scrollIntoView({ behavior: 'smooth', block: 'center' }); pick(im); }));
}
function swapAlt(q, path) { if (q.data.alts && typeof q.data.alts === 'object') q.data.alts[path] = (BUSINESS ? BUSINESS + ' – ' : '') + 'photo'; }

/* ---------------- AI tab ---------------- */
const EXAMPLES = ['Change our timings to 10 am – 9 pm, all 7 days', 'Add a Diwali offer: 10% off on modular kitchens till 31 Oct', 'Make the top heading shorter and bolder', 'Change the colour theme to dark green and gold', 'Add our Instagram link in the footer', 'Translate the top section to Hindi'];
let aiLast = '';
function tabAI() {
  pBody.innerHTML = `<p class="hint" style="margin-top:0">Type what you want, in English or Hindi. AI changes your website, then you can check it and press Publish.</p>
    <textarea class="fld" id="aiIn" placeholder="Example: Add a new service — Bathroom renovation, starting ₹45,000">${esc(aiLast)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn red full" id="aiGo">✨ Make the change</button></div>
    <label class="lab">Ideas</label><div class="row">${EXAMPLES.map(e => `<button class="chip">${esc(e)}</button>`).join('')}</div>
    <div id="aiOut"></div>`;
  pBody.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { $('#aiIn').value = c.textContent; $('#aiIn').focus(); }));
  $('#aiGo').addEventListener('click', runAI);
}
async function runAI() {
  const txt = $('#aiIn').value.trim(); if (txt.length < 4) { toast('Please type what you want to change'); return; }
  aiLast = txt; stopEditing(); commit();
  const stop = busy('AI is changing your website… (about 30–60 seconds)');
  try {
    const r = await api('ai', { instruction: txt, html: current });
    if (r.ok && r.html) {
      undoS.push(current); redoS.length = 0; current = r.html; await render(current, true); afterChange();
      aiLast = ''; tabAI(); $('#aiOut').innerHTML = `<div class="ai-msg ok">✅ ${esc(r.summary || 'Done.')} <br><b>Check it on the left/above.</b> Not right? Tap Undo.</div>`;
    } else {
      $('#aiOut').innerHTML = `<div class="ai-msg">${esc(r.summary || r.error || 'AI could not make this change. Try saying it differently.')}</div>`;
    }
  } catch (e) { $('#aiOut').innerHTML = `<div class="ai-msg err">⚠️ ${esc(e.message)}</div>`; }
  finally { stop(); }
}

/* ---------------- HISTORY tab ---------------- */
async function tabHistory() {
  pBody.innerHTML = `<p class="hint" style="margin-top:0">Every time you publish, a copy is saved. You can go back to any of them.</p><div class="list" id="vList"><div class="item"><div class="spin dark"></div><span class="hint" style="margin:0">Loading…</span></div></div>`;
  try {
    const r = await api('versions');

    $('#vList').innerHTML = L.map((v, i) => `<div class="ver"><div><b>${i === 0 ? 'Live now · ' : ''}${esc(fmtDate(v.date))}</b><small>${esc(v.message.split('\n')[0])}</small></div>${i === 0 ? '' : `<button class="btn sm" data-sha="${esc(v.sha)}">Use this</button>`}</div>`).join('');
    pBody.querySelectorAll('[data-sha]').forEach(b => b.addEventListener('click', async () => {
      const stop = busy('Opening that version…');
      try { const v = await api('version', { sha: b.dataset.sha }); if (!v.html) throw new Error('Could not open it'); undoS.push(current); redoS.length = 0; current = v.html; await render(current, false); afterChange(); toast('Old version opened · press Publish to make it live'); }

function fmtDate(s) { try { return new Date(s).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); } catch (e) { return s; } }

/* ---------------- top bar ---------------- */
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);

async function publish() {

    await api('save', { html: current, message: 'Edited by owner in website editor' });
    published = current; afterChange(); store.del(DRAFT);
    toast(`✅ Published! Live in about a minute · <a href="${esc(LIVE)}" target="_blank" rel="noopener">Open website</a>`, 6000);
  } catch (e) { toast('⚠️ ' + esc(e.message), 5000); }

}
addEventListener('beforeunload', e => { if (current && current !== published) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); } });

/* ---------------- start ---------------- */
(async function start() {
  if (!TOKEN) return fail('This link is missing its key.', 'Please open the edit link exactly as Amuwa sent it on WhatsApp.');
  try {
    const r = await api('load');
    if (!r.ok || !r.html) return fail('We could not open your website.', r.error || 'Please message Amuwa on WhatsApp.');
    BASE = r.base_url; LIVE = r.live_url; BUSINESS = r.business || '';
    $('#bizName').textContent = BUSINESS; document.title = 'Edit · ' + BUSINESS;
    published = current = r.html;
    const dr = store.get(DRAFT);
    await render(current, false);
    afterChange();
    $('#cover').remove();
    openTab('edit'); if (!isDesk()) panel.classList.add('open');
    if (dr && dr.html && dr.html !== current) {
      const b = document.createElement('div'); b.className = 'banner';
      b.innerHTML = `<b>You have unpublished changes</b> from ${esc(fmtDate(dr.at))}.<div class="row" style="margin:10px 0 0"><button class="btn pri sm" id="drUse">Continue editing</button><button class="btn sm" id="drNo">Discard</button></div>`;
      document.body.appendChild(b);
      $('#drUse').onclick = async () => { b.remove(); undoS.push(current); current = dr.html; await render(current, false); afterChange(); };
      $('#drNo').onclick = () => { b.remove(); store.del(DRAFT); };
    }
  } catch (e) { fail('We could not open your website.', e.message); }
})();
function fail(h, p) { const c = $('#cover'); c.innerHTML = `<h1>${esc(h)}</h1><p>${esc(p)}</p>`; }
})();
